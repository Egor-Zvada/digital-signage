upstream signage_backend {
    server unix:/run/signage/signage.sock;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name signage.vve.local 192.168.110.222;

    location = /signage-ca.crt {
        alias /etc/signage/tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="signage-vve-ca.crt"';
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signage.vve.local 192.168.110.222;

    ssl_certificate /etc/signage/tls/server.crt;
    ssl_certificate_key /etc/signage/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SignageTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 20g;
    client_body_timeout 1h;

    location /static/ {
        alias /srv/signage/static/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location /_protected_media/ {
        internal;
        alias /srv/signage/media/;
        sendfile on;
        aio threads;
        tcp_nopush on;
    }

    location / {
        proxy_pass http://signage_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }
}

