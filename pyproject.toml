[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vve-digital-signage"
version = "0.1.0"
description = "Локальная система цифровых экранов ОГАУ ДО СШ ВВЕ"
requires-python = ">=3.13"
dependencies = [
  "Django>=5.2.17,<5.3",
  "argon2-cffi>=25.1,<26",
  "Pillow>=11.3,<12",
  "psycopg[binary]>=3.2.9,<3.3",
  "uvicorn[standard]>=0.35,<0.36",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<0.13",
]

[tool.setuptools]
package-dir = {"" = "apps/server"}

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["apps/server"]
testpaths = ["apps/server/tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]
ignore = ["E501"]
